<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="KLIGER">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1932"/>
      <stop offset="55%" stop-color="#0e2043"/>
      <stop offset="100%" stop-color="#050e22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4d47c"/>
      <stop offset="45%" stop-color="#d9a825"/>
      <stop offset="100%" stop-color="#a67912"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9a825" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d9a825" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d9a825" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" rx="24" fill="url(#bg)"/>

  <rect x="18" y="18" width="604" height="324" rx="14" fill="none" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="1"/>

  <g transform="translate(320 130)">
    <circle r="72" fill="none" stroke="url(#gold)" stroke-width="1.25" opacity="0.75"/>
    <circle r="62" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.35"/>

    <g font-family="'Cormorant Garamond', 'Bellefair', serif" font-weight="500" font-size="96" text-anchor="middle" fill="url(#gold)">
      <text x="0" y="34" letter-spacing="2">K</text>
    </g>
  </g>

  <line x1="180" y1="228" x2="460" y2="228" stroke="url(#goldLine)" stroke-width="1"/>

  <g font-family="'Cormorant Garamond', 'Bellefair', serif" text-anchor="middle" fill="#f5e6b8">
    <text x="320" y="272" font-size="52" font-weight="500" letter-spacing="14">KLIGER</text>
  </g>

  <g font-family="'Rubik', 'Assistant', sans-serif" text-anchor="middle" fill="#c9a860" opacity="0.85">
    <text x="320" y="306" font-size="10.5" font-weight="500" letter-spacing="6">FINANCIAL ADVISORY</text>
  </g>
</svg>
